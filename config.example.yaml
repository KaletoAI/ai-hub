# AI-Hub — example config.
# Copy to config.yaml and edit. config.yaml is gitignored.

# Port — INFORMATIONAL ONLY. The listening port is set by the launch command
# (`uvicorn --port`, hard-coded in ai-hub.service); this value is merely displayed in
# the /ui Server tab so the console can show what the gateway is supposed to be on.
# Change the port in ai-hub.service (or your uvicorn command line), then here to match.
port: 4000

# Master/admin API key. Clients send it as `Authorization: Bearer <key>`; it also
# unlocks the /ui console (sign in with an admin key). Empty/missing = bootstrap-open
# (any caller accepted) UNTIL you add a user. Per-user keys with allow-lists + quotas
# are managed in the /ui Users tab (stored encrypted in store.db), not here.
api_key: "sk-change-me"

# How often (seconds) every enabled backend is polled for liveness + discovery. What is
# polled depends on the type: /v1/models for LLM backends, /object_info for ComfyUI,
# the credit balance for a cloud mesh backend (Meshy/Tripo).
health_check_interval: 30

# Per-request log lines (→ attempt, ← result with backend + status + duration).
# Set to false if you're using the stats DB and want a quieter log.
log_per_call: true

# Expose models in /v1/models prefixed with their backend name, e.g.
# `together/moonshotai/Kimi-K2.5-fp4` or `openrouter/nvidia/nemotron-3-ultra-…`.
# This makes the provider visible when the same model id exists on several
# backends. The prefix is stripped again before forwarding. Both forms are
# always accepted on input — a prefixed id routes to exactly that backend, a
# bare id/alias goes through the scheduler. Set false for legacy bare listing.
model_prefix: true

# Max in-flight requests per backend before it's treated as "busy" and skipped
# by the scheduler — the request spills to another candidate instead of
# queueing/overloading a slow one. Missing/0 = unlimited (default).
# This global value applies to every backend that doesn't set its own
# `max_concurrent` (see below). Busy backends are flagged on the routing tab.
# max_concurrent: 1

# Call parking (default): when EVERY backend that maps an alias is busy, the call
# is held in a FIFO queue until one frees, instead of returning 503. No client
# field is needed — a standard request just waits, then gets a 200 (or a 503 +
# Retry-After if the wait runs out).
# NOT config keys — these live in the /ui Server tab only (stored in store.db):
#   park time         default 60 s   how long a call waits for a free backend (0 = off)
#   max parked        default 100    queue cap; a busy call beyond this gets 503
#   affinity max wait default 120 s  see "Scheduling" below
# Per-alias override (blank/absent = the global default park time; 0 = parking off for
# that alias). Also editable per chat alias in the /ui Mapping editor (`park_s`).
# alias_park:
#   fast: 10              # this alias waits at most 10s
#   bulk: 0               # never parks — 503 immediately when busy
#
# Async LLM requests use the official OpenAI Responses background mode (no custom
# field): POST /v1/responses {background:true} -> queued id -> poll GET
# /v1/responses/{id} -> cancel POST /v1/responses/{id}/cancel. The background
# worker parks in the same queue, for up to 600 s (`async_park_timeout_s`, a default
# in main.py — neither a config key nor a Server-tab field; `apply_server_settings`
# would honour a stored settings row of that name, but no form writes one).
# A parked generation job whose backends briefly ALL go unhealthy (e.g. a busy
# ComfyUI dropping its discovery poll mid-render) rides out the flap for 90 s before
# it's declared "no healthy backend"; a genuinely-offline alias still fails after it
# (not the full park deadline). Also a main.py default (`park_health_grace_s`),
# readable from a stored settings row the same way — but with no form to write one.
#
# Scheduling: every request queues, and the fastest free UNPAID candidate takes it
# (speed = measured tok/s per LLM backend, seconds per media alias+backend; never
# measured = probed first). A backend that frees up prefers the oldest waiter of the
# type it just ran, so the loaded model/workflow stays loaded. This may hold a queued
# request back at most affinity_max_wait_s seconds; beyond that it is "overdue" and
# the next free capable backend takes it, strictly oldest-first. Server tab only.

# Optional call-stats sink: SQLite DB; the dashboard is built into the /ui console
# (Statistic tab) — no separate server/port anymore. When enabled, every call is
# recorded with backend, source (the authenticated user, else X-Source header / client
# IP), alias, model, tokens, status, duration, and USD cost (for backends that expose
# pricing in /v1/models — Together.ai does; local backends → 0).
# Toggle takes effect on full restart; not picked up by hot-reload.
# NOTE: optional — the Server tab in /ui manages these (stored, overriding config).
stats:
  enabled: false
  db_path: stats.db
  retention_days: 0   # 0 = keep forever; otherwise prune older rows hourly
  # blob_dir: calls   # full request/response bodies live here as files, never in the
  #                   # DB; they are pruned together with their rows

# Backends. The list order is display order only — the scheduler decides who runs
# what (see affinity_max_wait_s above).
#   enabled: false  → fully out of rotation (no health-check, no routing)
#   paid: true      → this backend costs money per request (cloud API); it is used
#                     only when NO unpaid backend is free
#   api_key         → sent as `Authorization: Bearer <key>` to this backend
#                     (use for cloud APIs like together.ai, OpenAI, OpenRouter, …)
#   max_concurrent  → per-backend in-flight cap; overrides the global one above.
#                     Match it to the backend's real parallelism — e.g. 1 for a
#                     llama.cpp server run with `--parallel 1`, high/unset for a
#                     cloud API that handles concurrency itself.
#   local           → ALSO list this backend's models bare (without the
#                     `<backend>/` prefix) in /v1/models, alongside the prefixed id.
#                     Listing only: a bare id is ALWAYS routed across every backend
#                     that exposes it (same failover as a virtual alias), whether or
#                     not they are `local` — this flag just makes the id discoverable
#                     to clients that read the catalog. Does not affect model_prefix;
#                     the prefixed id stays listed too.
#   host            → group several backends onto one physical box for the per-host GPU
#                     policies (Hosts panel); default = the URL's address
#   priority        → sorts the backend LIST only — it has routed nothing since the
#                     2026-09-01 scheduler spec (default 100)
backends:
  - name: local-gpu
    url: http://192.168.1.10:8080      # e.g. llama-swap, llama.cpp server, vLLM, …
    max_concurrent: 1                   # single-slot llama.cpp → 1 request at a time
    # host: gpu-box                     # this backend shares a GPU box with others
    # priority: 100                     # display order in the backend list, nothing else
    # sampling_defaults:                # folded in per backend for the keys the client
    #   temperature: 0.85               # AND the alias left unset (text endpoints only;
    #   min_p: 0.05                     # a non-dict value is warned about and ignored)
    # stream_reasoning_as_content: ["gemma-4*"]   # model globs whose streamed `reasoning`
    #                                   # deltas are relabelled `content` (LocalAI marks
    #                                   # every delta as reasoning after a thinking marker)
    # prompt_cache: true                # keep Claude Code's `cache_control` breakpoints
    #                                   # when translating /v1/messages for this chat
    #                                   # backend (OpenRouter → Anthropic/Gemini models)

  - name: local-cpu
    url: http://192.168.1.11:8080
    max_concurrent: 1
    # enabled: false                    # set to take this backend out of rotation

  # - name: together                    # Cloud fallback (OpenAI-compatible)
  #   url: https://api.together.xyz
  #   paid: true                        # only used when no unpaid backend is free
  #   api_key: "tgp_v1_…"               # https://api.together.xyz/settings/api-keys
  #   chat_only: true                   # skip image/video/embedding models
  #   serverless_only: true             # skip dedicated-endpoint-only models

  # - name: openrouter                  # Cloud fallback (OpenAI-compatible)
  #   url: https://openrouter.ai/api    # NOTE: /api only — the gateway appends /v1/…
  #   paid: true                        # only used when no unpaid backend is free
  #   api_key: "sk-or-v1-…"             # https://openrouter.ai/settings/keys
  #   chat_only: true                   # drop image/audio-output-only models
  #   serverless_only: false            # keep :free models; true = paid-only
  #                                     # (paid models need account credits, else HTTP 402)

  # - name: anthropic-sub               # Claude Code frontdoor — see README
  #   type: anthropic                   # reachable through /v1/messages ONLY
  #   url: https://api.anthropic.com
  #   api_key: "sk-ant-oat01-…"         # `claude setup-token` (valid 1 year; the
  #                                     # flow is headless-friendly — see README.
  #                                     # NOT the accessToken from
  #                                     # ~/.claude/.credentials.json, that expires
  #                                     # within hours)
  #   auth_mode: subscription           # subscription (OAuth setup-token) | api_key
  #   models: [claude-sonnet-5]         # fallback list if GET /v1/models is denied
  #   paid: true                        # subscription/API cost → unpaid backends first
  #   # LICENCE: a Claude subscription covers YOUR use of Claude Code — not
  #   # re-serving Claude as an API to other clients or people. The gateway
  #   # enforces that: this backend never appears on /v1/chat/completions,
  #   # /v1/responses or in the Playground. Please keep it that way.

# Virtual models — pseudo model names that map to real model IDs on backends.
#   string  → same model on every backend
#   dict    → per-backend mapping; backend keys without an entry are skipped.
#             A backend's value is the model id to call there.
#
# Routing: when a request comes in for `model: "fast"`, every backend that is healthy
# and exposes the mapped model is a candidate; the request goes to the fastest free
# unpaid one of them (queueing if all are busy). The rest become fallback if the
# chosen one errors.
virtual_models:
  "translator":  "Aya-Expanse-8B"        # same model on every backend
  "caption":     "llama-joycaption-beta-one"
  "vision":
    local-gpu:   "Qwen3-VL-8B"
    # local-cpu has no vision model → skipped for this alias
  "fast":
    local-gpu:   "Qwen3.5-9B"
    local-cpu:   "gemma-3-9b-it"
    # together:  "meta-llama/Meta-Llama-3.1-8B-Instruct-Turbo"

# ── Generation backends (image / video / audio / 3D) ──────────────────────────
# A ComfyUI backend speaks a different protocol than OpenAI, so it declares
# `type: comfyui`. Discovery uses /object_info (not /v1/models); dispatch submits
# a parametrized workflow and polls /history. Optional per-backend knobs:
#   poll_interval     → seconds between /history polls (default 1.0)
#   max_wait          → max seconds to wait for a result (default 600)
#   read_timeout      → per-HTTP-request read timeout (default 60); a hung /history
#                       or /view read fails fast → failover, not a max_wait stall
#   disconnect_grace  → seconds of continuous unreachability tolerated mid-run before
#                       failing over to the next candidate (default 30)
#   stuck_after_s     → executor watchdog: the same head prompt pending with an idle
#                       executor for this long marks the backend DOWN (default 90) —
#                       ComfyUI answers HTTP even when its prompt worker has died
#   auto_restart      → opt-in: reboot ComfyUI via ComfyUI-Manager when that fires
#   restart_cooldown_s → at most one auto-restart attempt per this many seconds (600)
#   self_retries      → extra attempts on the SAME generation backend before failing
#                       over (default 0; the in-flight slot is held across them)
#   comfy_output_dir  → ComfyUI's output dir on that host — needed for a `relay: path`
#                       chain hand-off (both stages on one backend, shared disk)
#   comfy_input_dir   → its input dir, for a `relay: upload` hand-off; blank = derived
#                       from comfy_output_dir's `…/input` sibling
# (Backends still take `paid`, `enabled`, `max_concurrent`, `host` like any other.)
#
#   - name: ct452-comfy
#     type: comfyui
#     url: http://192.168.1.20:8188
#     max_concurrent: 1               # one generation at a time on this GPU
#     poll_interval: 1.0
#     max_wait: 600
#     comfy_output_dir: /opt/ComfyUI/output   # enables a `relay: path` chain hand-off
#     stuck_after_s: 90               # executor watchdog threshold
#     auto_restart: true              # let the gateway reboot it when the watchdog fires
#     restart_cooldown_s: 600         # …at most once per 10 minutes
#     self_retries: 1                 # one retry here before the job fails over
#
# Meshy.ai is the second generation backend type: a cloud task API (image → 3D and
# multi-image → 3D), billed per task in credits, so it is ALWAYS paid — the scheduler
# reaches for it only when no unpaid backend is free. Its knobs:
#   poll_interval     → seconds between task polls (default 5)
#   max_wait          → cap for ONE task incl. Meshy's own queue (default 900)
#   disconnect_grace  → seconds of continuous unreachability / 5xx / 429 tolerated
#                       while polling before failing over (default 30). A persistent
#                       4xx (three in a row, 429 excepted) fails the job outright.
#
#   - name: meshy
#     type: meshy
#     url: https://api.meshy.ai
#     api_key: msy_...
#     max_concurrent: 4               # keep it <= your Meshy tier's concurrent-task
#                                     # limit (Pro: 10) — beyond it Meshy answers 429
#     poll_interval: 5
#     max_wait: 900
#
# A Meshy alias carries no workflow — endpoint + admin option defaults instead
# (edit them in the console; the option keys are meshy.OPTION_DEFAULTS):
#   "Meshy-Multiview":
#     - backend: meshy
#       task: img2mesh
#       model: latest                 # ai_model: latest | meshy-7 | meshy-6 | meshy-5
#       meshy:
#         endpoint: multi-image-to-3d # or image-to-3d (images.input_image)
#         options: {should_texture: true, enable_pbr: false, texture_resolution: "2k",
#                   topology: triangle, target_formats: [glb], thumbnail: true}
#
# The third endpoint, `rigging`, takes a MESH instead of an image (5 credits): the
# client sends it as files.input_mesh_path (a binary .glb of a biped) and gets back
# Meshy's own skeleton. Its client params are input_name and input_height_m (default
# 1.7) — plus input_no_fingers, which is advertised but inert; rigging knows glb/fbx
# and nothing else, and `animations: true` delivers Meshy's walking/running clips as
# extra artifacts.
#   "Meshy-Rig":
#     - backend: meshy
#       task: mesh2rig
#       meshy:
#         endpoint: rigging
#         options: {target_formats: [glb], animations: false}
#
# Workflow chain: a stage-1 alias carries a `successor` and the gateway delivers ONLY
# the successor's result (the mesh stage's own output is dropped, minus keep_from_mesh).
# Either stage may be ComfyUI or Meshy — here a Meshy mesh rigged locally by mesh-mia.
# A Meshy stage shares no disk with anything, so the mesh always travels as BYTES (any
# stored `relay` is ignored) and glb must be in target_formats, else the job is refused
# before credits are spent. Point `successor.alias` at "Meshy-Rig" instead to rig in the
# cloud — then `rig: meshy`, and the mesh never leaves Meshy.
#   "Meshy-Humanoid":
#     - backend: meshy
#       task: img2mesh
#       model: latest
#       meshy:
#         endpoint: image-to-3d
#         options: {target_formats: [glb], pose_mode: t-pose}
#       successor:
#         alias: mesh-mia             # the rigging alias (a ComfyUI or a Meshy one)
#         mesh_param: input_mesh_path # must be a request field of that alias
#         rig: mixamo                 # client-facing rig tag: mixamo | generic | meshy | tripo
#         # keep_from_mesh: ["preview.png"]   # stage-1 files to ship along

# Tripo3D (https://developers.tripo3d.ai, API V3) is the second cloud mesh backend —
# same idea as Meshy, billed per task in credits, hence ALWAYS paid. Two differences
# that show up in the knobs: it takes no inline bytes (every image/mesh is uploaded to
# /v3/files first — the gateway's business, not the client's), and one job may be
# SEVERAL tasks (rig-check, the main task, one convert per extra format, one retarget
# per animation clip). Its knobs:
#   poll_interval     -> seconds between task polls (default 2, the docs' own advice)
#   max_wait          -> cap for the WHOLE job, all its tasks together (default 900) —
#                        an alias with extra formats or clips needs more than a
#                        single-task one
#   disconnect_grace  -> as with Meshy (default 30); a persistent 4xx, or a non-zero
#                        `code` in Tripo's {code,data} envelope, fails the job outright
#
#   - name: tripo
#     type: tripo
#     url: https://openapi.tripo3d.ai # V3 only; V2 (api.tripo3d.ai/v2) ends 2026-11-01
#     api_key: tsk_...                # Tripo console -> API Keys
#     max_concurrent: 4               # keep it <= Tripo's per-account pool: 10 for the
#                                     # H-series (v2.5/v3.0/v3.1) and animation tasks,
#                                     # 5 for the P-series - beyond it Tripo answers 429
#     poll_interval: 2
#     max_wait: 900
#
# A Tripo alias carries no workflow either — endpoint + admin option defaults (edit
# them in the console; the option keys are tripo.OPTION_DEFAULTS). Tripo generates GLB
# and nothing else: every OTHER format in target_formats becomes its own convert task
# at 5 credits, and a convert that fails fails the job.
#   "Tripo-Object":
#     - backend: tripo
#       task: img2mesh
#       model: v3.1-20260211          # v3.1-20260211 | v3.0-20250812 | v2.5-20250123
#                                     # | P1-20260311 | P2-20260801
#       tripo:
#         endpoint: image-to-model    # or multiview-to-model: images.input_image_front
#                                     # (required) PLUS at least one of _back/_left/
#                                     # _right - Tripo refuses fewer than two views
#         options: {texture: true, pbr: true, texture_quality: standard,
#                   geometry_quality: standard, face_limit: null,
#                   target_formats: [glb], thumbnail: true}
#
# The third endpoint, `rig`, takes a MESH instead of an image: files.input_mesh_path (a
# binary .glb), 25 credits — preceded by Tripo's FREE rig-check, which ends the job
# before those credits if the mesh is not riggable. `spec: mixamo` gives the skeleton
# Mixamo-compatible bone names (job meta: rig_spec); `rig_model` v1.0-20240301 rigs
# BIPEDS only (a client input_rig_type that is not biped is then refused), v2.5-20260210
# every rig type. Each `animations` preset is a retarget task (10 credits) delivered as
# its own artifact, e.g. walk.glb; a clip that fails is skipped, never the job.
#   "Tripo-Rig":
#     - backend: tripo
#       task: mesh2rig
#       tripo:
#         endpoint: rig
#         options: {target_formats: [glb],   # the FIRST format is delivered natively
#                   rig_check: true, rig_model: v1.0-20240301, rig_type: biped,
#                   spec: mixamo, animations: [preset:walk]}
#
# Chained: a Tripo mesh rigged by Tripo itself (either stage may also be ComfyUI or
# Meshy — all combinations run). A cloud stage shares no disk, so the mesh always
# travels as BYTES and glb must be in the stage-1 target_formats. `face_limit` matters
# here: a rigger should not be handed a multi-million-face mesh.
#   "Tripo-Humanoid":
#     - backend: tripo
#       task: img2mesh
#       model: v3.1-20260211
#       tripo:
#         endpoint: image-to-model
#         options: {target_formats: [glb], face_limit: 150000}
#       successor:
#         alias: Tripo-Rig            # the rigging alias (ComfyUI, Meshy or Tripo)
#         mesh_param: input_mesh_path # must be a request field of that alias
#         rig: tripo                  # tagged only - a cloud rig is never normalized
#         # keep_from_mesh: ["preview.png"]   # stage-1 files to ship along

# Generation aliases: the `model` field of a POST /v1/generations request. Each
# maps to a list of candidates — the fastest free unpaid one runs the job, an
# execution error fails over to the next, and a backend that keeps failing is
# quarantined for 15 min (see the Backends tab). VRAM on a shared GPU box is freed
# before a job whose model set differs from the last one (per-host policy). A candidate
# names the backend, the task, the workflow file (API-format JSON), and optionally
# a model/checkpoint to inject into the workflow's loader node.
# `mapping` binds logical params to concrete workflow nodes+fields, e.g.
# "prompt → node 6, field text". This is convention-FREE: it works with any
# workflow regardless of how its nodes are named. Omit `mapping` to let the
# gateway auto-detect via naming heuristics (fine for templated workflows; the
# explicit form always wins). The /ui Mapping tab authors these for you — paste a
# workflow's API JSON and it pre-fills the bindings from the same heuristics.
# image_models:
#   "flux":
#     - backend:  ct452-comfy
#       task:     text2img
#       workflow: /srv/workflows/text2img_workflow_flux1_api.json
#       model:    flux1-dev-Q8_0.gguf        # optional — injected via the mapping
#       mapping:
#         prompt:          {node: "6",  field: "text"}
#         negative_prompt: {node: "7",  field: "text"}
#         width:           {node: "5",  field: "width"}
#         height:          {node: "5",  field: "height"}
#         steps:           {node: "3",  field: "steps"}
#         cfg:             {node: "3",  field: "cfg"}
#         seed:            {node: "3",  field: "seed"}
#         model:           {node: "4",  field: "unet_name"}
#         # A mapping entry may also carry a `label` — the param's PUBLIC api name.
#         # Incoming values are accepted under the label OR the param name, and the
#         # auto-random seed keys on whichever is effective:
#         # noise:         {node: "3",  field: "noise_seed", label: "seed"}
#         # An image slot decides what happens when the client leaves it empty
#         # (`placeholder` = the shared 72-byte dummy, `required` = 400, `disable` =
#         # prune the whole dead branch behind it), and may name extra nodes the
#         # prune cannot take but that must not run on nothing either:
#         # input_image:   {node: "10", field: "image", on_empty: "disable",
#         #                 on_empty_bypass: ["34"]}
#       # workflow_json: {...}                 # the workflow INLINE instead of a file
#       #                                      # path — what the /ui Mapping editor writes
#       # fixed:                               # PER-BACKEND pinned values; a pin is
#       #   - {node: "4", field: "unet_name", value: "flux1-dev-Q8_0.gguf"}
#       #                                      # authoritative — no API param overrides it
#       # bypass: ["12", "13"]                 # PER-BACKEND node ids removed and rewired
#       #                                      # (ComfyUI mode 4)
#       # output_node: "9"                     # which node's files are the delivery
#       # output_ext: glb                      # prefer the same-stem sibling with this ext
#       # output_globs: ["*.png"]              # unconditional extra files to ship
#       # output_cases: [...]                  # conditional deliveries, fetched once each
#       # texture_format: jpeg                 # transcode a generic texture PNG to JPEG q90
#       # dummy_check: false                   # opt out of the placeholder-image check (on)
#       # successor:                           # workflow chain — deliver ONLY stage 2
#       #   alias: mesh-mia                    # (same fields as the Meshy/Tripo examples
#       #   mesh_param: input_mesh_path        #  above: alias, export_node, mesh_param,
#       #   export_node: "31"                  #  relay, keep_from_mesh, rig)
#       #   relay: path                        # path (one backend, shared disk) | upload
#       #   rig: mixamo
#   "sdxl":
#     - backend:  ct452-comfy                # no `mapping` → auto-detected
#       task:     text2img
#       workflow: /srv/workflows/text2img_workflow_sd15_api.json

# Job store for generations: SQLite metadata + on-disk artifacts, retrievable by
# id (GET /v1/jobs/{id} + /result/{n}) until TTL. Auto-on when image_models are
# set. Sync requests also get their result inline; the cached copy stays until TTL.
# Optional in config — the Server tab in /ui manages these too (stored override).
# jobs:
#   enabled: true                # force the job store on without any image_models
#   db_path: jobs.db
#   blob_dir: jobs               # artifact files live under jobs/<id>/<n>.<ext>
#   default_ttl_s: 86400         # how long a result stays retrievable (24h)
#   prune_interval_s: 3600       # how often expired jobs are swept
#   store_path: store.db         # writable generation-alias store (UI source of truth)

# Management console: a server-rendered UI mounted at /ui on the main port. Manage
# backends, chat + generation aliases, workflow mappings, users, and server settings;
# run a chat/image playground; watch jobs, stats, and the live routing map. Always on
# (the writable store comes up with the gateway); the generation JOB store is what
# needs image_models or jobs.enabled: true.
# The store (store.db) is seeded once from this config, then becomes the source of
# truth — so you can run mostly from config OR mostly from the console.
#
# AUTH: the console is gated by an admin session once the gateway is "locked" (a
# master api_key above OR at least one user in the Users tab). With neither, it's
# bootstrap-open. Per-user keys carry an allow-list (chat/image aliases, model ids,
# or whole backends — which also filters what each key sees in /v1/models) and an
# optional monthly cost quota. Keep the console on a trusted network regardless.
